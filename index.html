<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task2 — Neo-Brutalist To-Do App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <main class="app">
    <section class="hero-card">
      <p class="sticker">TASK 2</p>
      <h1>TO-DO <span>LIST</span></h1>
      <p class="hero-text">
        A client-side task manager with full CRUD, filtering, localStorage persistence,
        and interactive state-driven rendering.
      </p>
    </section>

    <section class="stats-grid">
      <article class="stat-card">
        <p class="stat-label">Total</p>
        <h2 id="total-count">0</h2>
      </article>

      <article class="stat-card yellow-card">
        <p class="stat-label">Active</p>
        <h2 id="active-count">0</h2>
      </article>

      <article class="stat-card purple-card">
        <p class="stat-label">Completed</p>
        <h2 id="completed-count">0</h2>
      </article>
    </section>

    <section class="panel add-panel">
      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="TYPE A NEW TASK..."
          maxlength="120"
          autocomplete="off"
        />

        <select id="priority-select" aria-label="Task priority">
          <option value="low">LOW</option>
          <option value="medium" selected>MEDIUM</option>
          <option value="high">HIGH</option>
        </select>

        <button type="submit" class="primary-btn">ADD TASK</button>
      </form>

      <p id="form-message" class="form-message" aria-live="polite"></p>
    </section>

    <section class="panel toolbar">
      <div class="filter-group" id="filter-group">
        <button class="filter-btn active" data-filter="all" type="button">ALL</button>
        <button class="filter-btn" data-filter="active" type="button">ACTIVE</button>
        <button class="filter-btn" data-filter="completed" type="button">COMPLETED</button>
      </div>

      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="SEARCH TASKS..." />
      </div>

      <div class="bulk-actions" id="bulk-actions">
        <button class="secondary-btn" data-action="mark-all" type="button">MARK ALL DONE</button>
        <button class="secondary-btn" data-action="clear-completed" type="button">CLEAR COMPLETED</button>
      </div>
    </section>

    <section class="panel progress-panel">
      <div class="progress-top">
        <strong>PROGRESS</strong>
        <span id="progress-text">0% COMPLETED</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </section>

    <section class="panel list-panel">
      <ul id="todo-list" class="todo-list"></ul>
      <div id="empty-state" class="empty-state">
        <h3>NO TASKS YET</h3>
        <p>ADD A TASK TO START BUILDING YOUR LIST.</p>
      </div>
    </section>
  </main>
</body>
</html>
