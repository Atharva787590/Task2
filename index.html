<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task2 — To-Do List App</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <main class="app">
    <section class="todo-shell">
      <header class="app-header">
        <p class="eyebrow">Task 2</p>
        <h1>To-Do List</h1>
        <p class="subtitle">
          A state-driven task manager with CRUD operations, filtering, and local storage persistence.
        </p>
      </header>

      <section class="todo-input-card">
        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Add a new task</label>
          <input
            id="todo-input"
            type="text"
            placeholder="Enter a task..."
            autocomplete="off"
            maxlength="120"
          />
          <button type="submit" class="primary-btn">Add Task</button>
        </form>

        <p id="form-message" class="form-message" aria-live="polite"></p>
      </section>

      <section class="toolbar-card">
        <div class="task-summary">
          <span id="task-count">0</span> task(s) total
        </div>

        <div class="filters" role="tablist" aria-label="Task filters">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>

        <button id="clear-completed" class="secondary-btn" type="button">
          Clear Completed
        </button>
      </section>

      <section class="todo-list-card">
        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        <div id="empty-state" class="empty-state">
          No tasks yet. Add your first task to begin.
        </div>
      </section>
    </section>
  </main>
</body>
</html>
